<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="اپکس پلنر"/>
<title>اپکس پلنر — دستیار کنکور</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Cpath d='M50 20 L78 75 L60 75 L50 52 L40 75 L22 75 Z' fill='%236366f1'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#03050a;
  --bg-grid:#060a14;
  --surface:#0c1120;
  --surface-2:#12192f;
  --surface-3:#1a2340;
  --surface-4:#232d4a;
  --border:#2a3555;
  --border-soft:#1f2a45;
  --primary:#6366f1;
  --primary-bright:#818cf8;
  --primary-dim:#4f46e5;
  --primary-light:#a5b4fc;
  --primary-glow:rgba(99,102,241,.35);
  --text-1:#ffffff;
  --text-2:#b4bccf;
  --text-3:#758099;
  --success:#10b981;
  --success-glow:rgba(16,185,129,.35);
  --warning:#f59e0b;
  --warning-glow:rgba(245,158,11,.35);
  --danger:#ef4444;
  --danger-glow:rgba(239,68,68,.35);
  --gold:#fbbf24;
  --radius-sm:14px;
  --radius:20px;
  --radius-lg:28px;
  --radius-xl:36px;
  --radius-full:999px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --shadow-md:0 8px 28px rgba(0,0,0,.45);
  --shadow-lg:0 16px 56px rgba(0,0,0,.55);
  --shadow-glow:0 0 50px var(--primary-glow);
  --shadow-inner:inset 0 1px 2px rgba(255,255,255,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 900px 600px at 10% -10%, rgba(99,102,241,.15), transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 20%, rgba(129,140,248,.1), transparent 55%),
    radial-gradient(ellipse 500px 400px at 50% 100%, rgba(79,70,229,.08), transparent 50%),
    linear-gradient(180deg, rgba(255,255,255,.02) 0%, transparent 100%);
  background-attachment:fixed;
  color:var(--text-1);
  font-family:'Vazirmatn',sans-serif;
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.material-symbols-rounded{
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
  line-height:1;
  vertical-align:middle;
}
::-webkit-scrollbar{width:0;height:0;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:inherit; text-decoration:none;}

#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(88px + var(--safe-bottom));}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  padding:calc(16px + var(--safe-top)) 20px 14px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, rgba(3,5,10,.98) 0%, rgba(3,5,10,.92) 65%, rgba(3,5,10,0) 100%);
  backdrop-filter:blur(20px) saturate(200%);
  border-bottom:1px solid rgba(99,102,241,.1);
}
.topbar .brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,#818cf8,#6366f1,#4f46e5);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px var(--primary-glow), inset 0 2px 10px rgba(255,255,255,.25);
  font-weight:900; font-size:19px;
  position:relative; overflow:hidden;
}
.brand-mark::before{
  content:''; position:absolute; inset:-2px;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-100%); animation:shimmer 3.5s ease-in-out infinite;
}
@keyframes shimmer{to{transform:translateX(100%);}}
.brand-name{font-weight:900; font-size:19px; letter-spacing:-.02em; background:linear-gradient(135deg,#fff,#e0e7ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 2px 10px rgba(99,102,241,.3);}
.icon-btn{
  width:42px;height:42px;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
  border:1px solid rgba(99,102,241,.18);
  color:var(--text-2); position:relative;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow-sm);
}
.icon-btn:active{transform:scale(.9); box-shadow:var(--shadow-md);}
.icon-btn:hover{border-color:var(--primary); color:var(--primary-bright); box-shadow:0 4px 16px rgba(99,102,241,.2);}
.badge-dot{
  position:absolute; top:9px; left:9px; width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  border:2px solid var(--bg);
  box-shadow:0 0 16px rgba(239,68,68,.7);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.75;transform:scale(1.15);}}

/* ---------- Screens ---------- */
.screen{display:none; padding:6px 20px 26px; animation:fadeIn .35s cubic-bezier(.2,.8,.2,1);}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(12px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}

.page-title{font-size:28px; font-weight:900; letter-spacing:-.02em; margin:10px 0 6px; background:linear-gradient(135deg,#fff,#eef2ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 4px 20px rgba(99,102,241,.25);}
.page-sub{color:var(--text-2); font-size:14.5px; margin:0 0 22px; font-weight:500; line-height:1.6;}

/* ---------- Cards ---------- */
.card{
  background:linear-gradient(135deg,var(--surface),var(--surface-2));
  border:1px solid rgba(99,102,241,.14);
  border-radius:var(--radius-lg); padding:20px;
  position:relative; overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.card:hover{box-shadow:var(--shadow-md); transform:translateY(-3px);}
.card + .card{margin-top:16px;}
.glass{
  background:rgba(18,25,47,.65);
  backdrop-filter:blur(24px) saturate(200%);
  border:1px solid rgba(99,102,241,.22);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.06), 0 4px 20px rgba(0,0,0,.3);
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.stat-card{padding:20px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden;}
.stat-card::before{
  content:''; position:absolute; top:-60%; right:-60%; width:100%; height:100%;
  background:radial-gradient(circle,rgba(99,102,241,.1),transparent 70%);
  pointer-events:none;
}
.stat-card::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.03),transparent);
  opacity:0; transition:opacity .3s ease;
}
.stat-card:hover::after{opacity:1;}
.stat-card .stat-icon{
  width:48px;height:48px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(99,102,241,.1));
  color:var(--primary-bright); font-size:24px;
  box-shadow:0 6px 18px rgba(99,102,241,.25), inset 0 1px 2px rgba(255,255,255,.1);
  border:1px solid rgba(99,102,241,.2);
  transition:all .25s ease;
}
.stat-card:hover .stat-icon{transform:scale(1.05); box-shadow:0 8px 24px rgba(99,102,241,.35);}
.stat-card .stat-label{font-size:13.5px; color:var(--text-2); font-weight:700;}
.stat-card .stat-value{font-size:23px; font-weight:900; letter-spacing:-.01em; background:linear-gradient(135deg,#fff,#cbd5e1); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}

/* ---------- Buttons ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:9px;
  padding:17px 22px; border-radius:var(--radius); border:none;
  font-weight:800; font-size:15.5px; width:100%;
  transition:all .25s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden;
}
.btn::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:translateX(-100%); transition:transform .45s ease;
}
.btn:hover::before{transform:translateX(100%);}
.btn-primary{
  background:linear-gradient(135deg,#818cf8,#6366f1,#4f46e5);
  color:#fff; box-shadow:0 12px 36px -10px var(--primary-glow), inset 0 1px 2px rgba(255,255,255,.2);
  letter-spacing:-.01em;
}
.btn-primary:hover{box-shadow:0 16px 48px -8px var(--primary-glow), inset 0 1px 2px rgba(255,255,255,.25);}
.btn-primary:active{transform:translateY(2px) scale(.97);}
.btn-ghost{
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
  color:var(--text-1); border:1px solid rgba(99,102,241,.18);
  transition:all .25s ease;
}
.btn-ghost:hover{border-color:var(--primary); box-shadow:0 6px 20px rgba(99,102,241,.2), inset 0 1px 0 rgba(255,255,255,.05);}
.btn-sm{padding:11px 17px; font-size:14px; width:auto; border-radius:var(--radius-sm); font-weight:700;}
.btn-danger-ghost{background:rgba(239,68,68,.15); color:var(--danger); border:1px solid rgba(239,68,68,.35); box-shadow:0 4px 14px rgba(239,68,68,.15);}
.btn-row{display:flex; gap:14px;}
.btn-row .btn{flex:1;}
.fab-plus{
  width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));
  display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:inset 0 2px 5px rgba(255,255,255,.15), 0 2px 8px rgba(0,0,0,.2);
}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; right:0; left:0; z-index:50;
  max-width:520px; margin:0 auto;
  background:linear-gradient(180deg,rgba(12,17,32,.94),rgba(3,5,10,.97));
  backdrop-filter:blur(28px) saturate(200%);
  border-top:1px solid rgba(99,102,241,.18);
  padding:12px 8px calc(12px + var(--safe-bottom));
  display:flex; justify-content:space-around;
  box-shadow:0 -10px 40px rgba(0,0,0,.5), 0 -2px 10px rgba(99,102,241,.1);
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:9px 14px; border-radius:16px; color:var(--text-3);
  background:none; border:none; flex:1;
  transition:all .25s cubic-bezier(.4,0,.2,1); position:relative;
}
.nav-item::after{
  content:''; position:absolute; bottom:5px; width:0; height:3px;
  background:linear-gradient(90deg,var(--primary-bright),var(--primary));
  border-radius:99px; transition:width .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px var(--primary-glow);
}
.nav-item.active::after{width:24px;}
.nav-item .material-symbols-rounded{font-size:25px; filter:drop-shadow(0 2px 5px rgba(0,0,0,.35)); transition:all .25s ease;}
.nav-item span.lbl{font-size:11.5px; font-weight:700; letter-spacing:.01em;}
.nav-item.active{color:var(--primary-bright); transform:translateY(-3px);}
.nav-item.active .material-symbols-rounded{font-variation-settings:'FILL' 1,'wght' 600; filter:drop-shadow(0 3px 12px var(--primary-glow)); transform:scale(1.05);}
.nav-item:active{transform:scale(.9); opacity:.8;}
.nav-item:hover{color:var(--primary-light);}

/* ---------- Progress ring ---------- */
.ring-wrap{position:relative; width:64px; height:64px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--surface-3); stroke-width:6;}
.ring-fg{fill:none; stroke:var(--primary-bright); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.ring-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800;
}

/* ---------- Progress bar ---------- */
.pbar{height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; position:relative;}
.pbar > div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary-dim),var(--primary-bright)); transition:width .5s ease;}
.pbar.thin{height:5px;}

/* ---------- Chips / tags ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 13px;
  border-radius:99px; font-size:12.5px; font-weight:700;
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
  color:var(--text-2); border:1px solid rgba(99,102,241,.12);
  transition:all .2s ease; box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.chip:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.3);}
.chip.on{background:linear-gradient(135deg,var(--primary),var(--primary-dim)); color:#fff; border-color:rgba(99,102,241,.4); box-shadow:0 4px 14px var(--primary-glow);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.tag-subject{background:rgba(99,102,241,.18); color:var(--primary-bright); border-color:rgba(99,102,241,.25);}
.tag-diff-easy{background:rgba(16,185,129,.15); color:var(--success); border-color:rgba(16,185,129,.25);}
.tag-diff-mid{background:rgba(245,158,11,.15); color:var(--warning); border-color:rgba(245,158,11,.25);}
.tag-diff-hard{background:rgba(239,68,68,.15); color:var(--danger); border-color:rgba(239,68,68,.25);}

/* ---------- Section header ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 14px;}
.section-head h3{font-size:16px; font-weight:800; margin:0; letter-spacing:-.01em;}
.section-head .more{font-size:13px; color:var(--primary-bright); font-weight:700; transition:all .2s;}
.section-head .more:hover{letter-spacing:.5px;}

/* ---------- Plan item ---------- */
.plan-item{
  display:flex; align-items:center; gap:14px; padding:15px;
  background:linear-gradient(135deg,var(--surface-2),rgba(22,30,50,.8));
  border:1px solid rgba(99,102,241,.1); border-radius:var(--radius);
  transition:all .2s ease; box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.plan-item:hover{transform:translateX(4px); box-shadow:0 4px 16px rgba(99,102,241,.1);}
.plan-item + .plan-item{margin-top:10px;}
.check-circle{
  width:28px;height:28px;border-radius:50%; flex-shrink:0;
  border:2px solid var(--text-3); display:flex; align-items:center; justify-content:center;
  color:transparent; font-size:16px; transition:all .25s cubic-bezier(.4,0,.2,1);
  background:var(--surface-3);
}
.check-circle:hover{border-color:var(--primary); transform:scale(1.1);}
.check-circle.done{
  background:linear-gradient(135deg,var(--success),#059669);
  border-color:var(--success); color:#fff;
  box-shadow:0 4px 12px rgba(16,185,129,.4);
  animation:checkPop .3s cubic-bezier(.4,0,.2,1);
}
@keyframes checkPop{0%{transform:scale(1);} 50%{transform:scale(1.25);} 100%{transform:scale(1);}}
.plan-item.done{opacity:.5;}
.plan-item.done .plan-title{text-decoration:line-through;}
.plan-title{font-size:15px; font-weight:800; letter-spacing:-.01em;}
.plan-meta{display:flex; gap:12px; margin-top:5px; font-size:12px; color:var(--text-3); font-weight:600;}
.plan-meta span{display:flex; align-items:center; gap:4px;}
.cat-dot{width:8px;height:8px;border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor;}
.cat-درسی{background:var(--primary-bright); color:var(--primary-bright);}
.cat-توسعه_فردی{background:var(--gold); color:var(--gold);}
.cat-غیردرسی{background:var(--text-3); color:var(--text-3);}

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:40px 20px; color:var(--text-2);
}
.empty .material-symbols-rounded{font-size:38px; color:var(--text-3); margin-bottom:10px;}
.empty p{margin:4px 0 0; font-size:13.5px;}

/* ---------- Modal / sheet ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,8,18,.72); backdrop-filter:blur(4px);
  z-index:100; display:none; align-items:flex-end; justify-content:center;
}
.overlay.active{display:flex;}
.sheet{
  width:100%; max-width:480px; background:var(--surface);
  border-radius:24px 24px 0 0; border:1px solid var(--border-soft); border-bottom:none;
  padding:10px 20px calc(24px + var(--safe-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideUp .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:6px auto 14px;}
.sheet h2{font-size:17px; font-weight:800; margin:0 0 16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:7px;}
.field input, .field select, .field textarea{
  width:100%; padding:13px 14px; border-radius:var(--radius-sm);
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-1);
  font-size:14.5px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical; min-height:70px;}
.seg{display:flex; background:var(--surface-2); border-radius:var(--radius-sm); padding:4px; gap:4px;}
.seg button{
  flex:1; padding:9px 6px; border:none; background:none; border-radius:8px;
  font-size:12.5px; font-weight:700; color:var(--text-2);
}
.seg button.active{background:var(--primary); color:#fff;}

/* modal for center dialogs (confirm etc) */
.overlay.center{align-items:center;}
.dialog{
  width:88%; max-width:340px; background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:22px; text-align:center; animation:popIn .2s ease;
}
@keyframes popIn{from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);}}
.dialog .material-symbols-rounded.big{font-size:36px; color:var(--primary-bright); margin-bottom:8px;}
.dialog h3{font-size:16px; margin:0 0 6px;}
.dialog p{font-size:13px; color:var(--text-2); margin:0 0 18px;}

/* ---------- toast ---------- */
#toast{
  position:fixed; bottom:calc(96px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
  border:1px solid rgba(99,102,241,.2); color:var(--text-1);
  padding:13px 22px; border-radius:99px; font-size:14px; font-weight:700;
  z-index:200; opacity:0; pointer-events:none; transition:all .3s cubic-bezier(.4,0,.2,1);
  display:flex; align-items:center; gap:10px; white-space:nowrap;
  box-shadow:0 12px 40px rgba(0,0,0,.5), 0 0 20px var(--primary-glow);
  backdrop-filter:blur(16px);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast .material-symbols-rounded{font-size:18px; color:var(--success); filter:drop-shadow(0 2px 6px rgba(16,185,129,.4));}

/* ---------- Timer screen ---------- */
.timer-orbit{position:relative; width:100%; padding:30px 0 10px; display:flex; justify-content:center;}
.timer-ring-wrap{position:relative; width:280px; height:280px;}
.timer-ring-wrap svg{transform:rotate(-90deg); width:100%; height:100%;}
.timer-ring-bg{fill:none; stroke:var(--surface-3); stroke-width:10;}
.timer-ring-fg{fill:none; stroke:url(#timerGrad); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s linear; filter:drop-shadow(0 0 12px var(--primary-glow));}
.timer-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
}
.timer-display{font-size:52px; font-weight:900; letter-spacing:-.02em; font-variant-numeric:tabular-nums; text-shadow:0 0 40px var(--primary-glow); background:linear-gradient(135deg,#fff,#cbd5e1); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.timer-label{font-size:13px; color:var(--text-2); font-weight:700; letter-spacing:.5px; text-transform:uppercase;}
.timer-controls{display:flex; gap:16px; justify-content:center; margin-top:26px;}
.timer-btn-round{
  width:64px;height:64px;border-radius:50%; border:1px solid rgba(99,102,241,.15);
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
  display:flex; align-items:center; justify-content:center; color:var(--text-1); font-size:26px;
  transition:all .2s ease; box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.timer-btn-round:hover{transform:scale(1.05); border-color:var(--primary);}
.timer-btn-round.main{
  width:82px;height:82px; background:linear-gradient(135deg,var(--primary-bright),var(--primary));
  box-shadow:0 12px 40px -8px var(--primary-glow); color:#fff; font-size:34px; border:none;
}
.timer-btn-round.main:hover{transform:scale(1.08); box-shadow:0 16px 50px -10px var(--primary-glow);}
.mode-pills{display:flex; gap:10px; justify-content:center; margin-top:20px;}

/* ---------- Question card ---------- */
.qcard{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius); padding:15px;}
.qcard + .qcard{margin-top:11px;}
.qcard .qtext{font-size:14px; font-weight:600; line-height:1.9; margin-bottom:10px;}
.qcard .qopts{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
.qopt{font-size:12.5px; color:var(--text-2); padding:8px 11px; background:var(--surface); border-radius:8px; border:1px solid var(--border-soft);}
.qopt.correct{border-color:rgba(34,197,94,.4); color:var(--success); background:rgba(34,197,94,.08);}

/* ---------- Filter bar (scrollable chips) ---------- */
.filter-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-scroll .chip{flex-shrink:0;}

/* ---------- Bar chart (weekly) ---------- */
.barchart{display:flex; align-items:flex-end; justify-content:space-between; height:140px; gap:6px; padding:0 4px;}
.barcol{display:flex; flex-direction:column; align-items:center; gap:8px; flex:1;}
.barcol .bar{width:100%; max-width:26px; border-radius:6px 6px 3px 3px; background:var(--surface-3); position:relative; min-height:4px;}
.barcol .bar > div{position:absolute; bottom:0; right:0; left:0; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg,var(--primary-bright),var(--primary-dim));}
.barcol .bar-label{font-size:10.5px; color:var(--text-3); font-weight:600;}
.barcol.today .bar-label{color:var(--primary-bright);}

/* ---------- Toggle switch ---------- */
.switch{position:relative; width:44px; height:25px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:var(--surface-3); border-radius:99px; transition:.2s; border:1px solid var(--border);}
.switch .slider:before{content:''; position:absolute; width:19px; height:19px; right:2px; top:2px; background:var(--text-2); border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--primary);}
.switch input:checked + .slider:before{background:#fff; transform:translateX(-19px);}

/* ---------- list row (settings/profile) ---------- */
.list-row{display:flex; align-items:center; gap:13px; padding:14px 4px;}
.list-row + .list-row{border-top:1px solid var(--border-soft);}
.list-row .li-icon{width:36px;height:36px;border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:19px; flex-shrink:0;}
.list-row .li-body{flex:1;}
.list-row .li-title{font-size:14px; font-weight:700;}
.list-row .li-sub{font-size:11.5px; color:var(--text-3); margin-top:1px;}

/* Streak days */
.streak-row{display:flex; justify-content:space-between; margin-top:14px;}
.streak-day{display:flex; flex-direction:column; align-items:center; gap:6px;}
.streak-day .d-lbl{font-size:10.5px; color:var(--text-3); font-weight:600;}
.streak-dot{width:30px;height:30px;border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:var(--surface-3); color:var(--text-3);}
.streak-dot.done{background:var(--success); color:#fff;}
.streak-dot.today{background:var(--primary); color:#fff; box-shadow:0 0 0 3px rgba(99,102,241,.25);}

/* Analysis bank — PDF viewer */
.pdf-viewer-wrap{border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden; background:var(--surface-2);}
.pdf-viewer{width:100%; height:60vh; min-height:420px; border:0; display:block; background:#fff;}
/* -------------------------------------------------------------------------
   PDF.js viewer (canvas-based) — جایگزین iframe
   دلیل: نمایش PDF داخل <iframe> با src=".../file.pdf#page=N" روی خیلی از
   مرورگرهای موبایل و WebView داخل اپلیکیشن اصلاً کار نمی‌کنه (پیام
   "content is blocked" یا صفحه‌ی سفید) و در Edge دسکتاپ هم با هر پرش،
   کل PDF از صفحه‌ی ۱ دوباره لود می‌شد. رندر با pdf.js روی canvas مستقل
   از پلاگین PDF مرورگره و روی همه‌ی پلتفرم‌ها یکسان کار می‌کنه.
   ------------------------------------------------------------------------- */
.pdfjs-wrap{border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden; background:var(--surface-2);}
.pdfjs-toolbar{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; background:var(--surface-3); border-bottom:1px solid var(--border-soft);}
.pdfjs-toolbar .pdfjs-nav{display:flex; align-items:center; gap:6px;}
.pdfjs-toolbar button{background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-1); border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.pdfjs-toolbar button:disabled{opacity:.4; cursor:default;}
.pdfjs-toolbar .pdfjs-page-label{font-size:12.5px; color:var(--text-2); min-width:70px; text-align:center;}
.pdfjs-canvas-scroll{width:100%; height:60vh; min-height:420px; overflow:auto; background:#525659; display:flex; align-items:flex-start; justify-content:center; padding:10px 0;}
.pdfjs-canvas-scroll canvas{box-shadow:0 2px 10px rgba(0,0,0,.35); background:#fff;}
.pdfjs-status{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--text-3); font-size:12.5px; width:100%; padding:40px 0;}

.hide{display:none !important;}
</style>
</head>
<body>

<div id="app">

<!-- pdf.js — برای رندر PDF داخل canvas، مستقل از پلاگین PDF مرورگر

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs";
  window.pdfjsLib = pdfjsLib;
  window.dispatchEvent(new Event('pdfjs-ready'));
</script>
