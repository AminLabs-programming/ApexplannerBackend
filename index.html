<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="اپکس پلنر"/>
<title>اپکس پلنر — دستیار کنکور</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Cpath d='M50 20 L78 75 L60 75 L50 52 L40 75 L22 75 Z' fill='%236366f1'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#0a0f1e;
  --bg-grid:#0f172a;
  --surface:#141b2e;
  --surface-2:#1a2338;
  --surface-3:#212c46;
  --border:#232f4d;
  --border-soft:#1b2540;
  --primary:#6366f1;
  --primary-bright:#818cf8;
  --primary-dim:#4338ca;
  --primary-glow:rgba(99,102,241,.35);
  --text-1:#f4f6fb;
  --text-2:#8b96b3;
  --text-3:#5b6584;
  --success:#22c55e;
  --warning:#f59e0b;
  --danger:#ef4444;
  --gold:#fbbf24;
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --radius-full:999px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 600px 400px at 15% -10%, rgba(99,102,241,.16), transparent 60%),
    radial-gradient(ellipse 500px 400px at 100% 20%, rgba(129,140,248,.08), transparent 55%);
  color:var(--text-1);
  font-family:'Vazirmatn',sans-serif;
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-rounded{
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
  line-height:1;
  vertical-align:middle;
}
::-webkit-scrollbar{width:0;height:0;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:inherit; text-decoration:none;}

#app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(84px + var(--safe-bottom));}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  padding:calc(14px + var(--safe-top)) 18px 12px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, rgba(10,15,30,.92) 60%, rgba(10,15,30,0));
  backdrop-filter:blur(10px);
}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dim));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px var(--primary-glow);
  font-weight:800; font-size:15px;
}
.brand-name{font-weight:800; font-size:17px; letter-spacing:-.01em;}
.icon-btn{
  width:38px;height:38px;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2); border:1px solid var(--border-soft);
  color:var(--text-2); position:relative;
}
.icon-btn:active{transform:scale(.92);}
.badge-dot{
  position:absolute; top:6px; left:8px; width:7px;height:7px;border-radius:50%;
  background:var(--danger); border:2px solid var(--bg-grid);
}

/* ---------- Screens ---------- */
.screen{display:none; padding:4px 18px 24px; animation:fadeIn .25s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.page-title{font-size:24px; font-weight:800; letter-spacing:-.01em; margin:6px 0 2px;}
.page-sub{color:var(--text-2); font-size:13.5px; margin:0 0 18px;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:16px;
  position:relative; overflow:hidden;
}
.card + .card{margin-top:12px;}
.glass{
  background:rgba(26,35,56,.55);
  backdrop-filter:blur(16px);
  border:1px solid rgba(99,102,241,.15);
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stat-card{padding:16px; display:flex; flex-direction:column; gap:8px;}
.stat-card .stat-icon{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(99,102,241,.14); color:var(--primary-bright); font-size:19px;
}
.stat-card .stat-label{font-size:12.5px; color:var(--text-2); font-weight:500;}
.stat-card .stat-value{font-size:19px; font-weight:800;}

/* ---------- Buttons ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 18px; border-radius:var(--radius); border:none;
  font-weight:700; font-size:14.5px; width:100%;
}
.btn-primary{
  background:linear-gradient(135deg,var(--primary-bright),var(--primary));
  color:#fff; box-shadow:0 8px 24px -6px var(--primary-glow);
}
.btn-primary:active{transform:translateY(1px) scale(.99);}
.btn-ghost{
  background:var(--surface-2); color:var(--text-1); border:1px solid var(--border);
}
.btn-sm{padding:9px 14px; font-size:13px; width:auto; border-radius:var(--radius-sm);}
.btn-danger-ghost{background:rgba(239,68,68,.1); color:var(--danger); border:1px solid rgba(239,68,68,.25);}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
.fab-plus{
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; right:0; left:0; z-index:50;
  max-width:480px; margin:0 auto;
  background:rgba(15,20,38,.88); backdrop-filter:blur(20px);
  border-top:1px solid var(--border-soft);
  padding:8px 6px calc(8px + var(--safe-bottom));
  display:flex; justify-content:space-around;
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 10px; border-radius:12px; color:var(--text-3);
  background:none; border:none; flex:1;
}
.nav-item .material-symbols-rounded{font-size:23px;}
.nav-item span.lbl{font-size:10.5px; font-weight:600;}
.nav-item.active{color:var(--primary-bright);}
.nav-item.active .material-symbols-rounded{font-variation-settings:'FILL' 1,'wght' 500;}

/* ---------- Progress ring ---------- */
.ring-wrap{position:relative; width:64px; height:64px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--surface-3); stroke-width:6;}
.ring-fg{fill:none; stroke:var(--primary-bright); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.ring-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800;
}

/* ---------- Progress bar ---------- */
.pbar{height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; position:relative;}
.pbar > div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary-dim),var(--primary-bright)); transition:width .5s ease;}
.pbar.thin{height:5px;}

/* ---------- Chips / tags ---------- */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px;
  border-radius:99px; font-size:12px; font-weight:600;
  background:var(--surface-3); color:var(--text-2); border:1px solid var(--border);
}
.chip.on{background:rgba(99,102,241,.16); color:var(--primary-bright); border-color:rgba(99,102,241,.3);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.tag-subject{background:rgba(99,102,241,.14); color:var(--primary-bright);}
.tag-diff-easy{background:rgba(34,197,94,.14); color:var(--success);}
.tag-diff-mid{background:rgba(245,158,11,.14); color:var(--warning);}
.tag-diff-hard{background:rgba(239,68,68,.14); color:var(--danger);}

/* ---------- Section header ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;}
.section-head h3{font-size:15.5px; font-weight:700; margin:0;}
.section-head .more{font-size:12.5px; color:var(--primary-bright); font-weight:600;}

/* ---------- Plan item ---------- */
.plan-item{
  display:flex; align-items:center; gap:12px; padding:13px;
  background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius);
}
.plan-item + .plan-item{margin-top:9px;}
.check-circle{
  width:26px;height:26px;border-radius:50%; flex-shrink:0;
  border:2px solid var(--text-3); display:flex; align-items:center; justify-content:center;
  color:transparent; font-size:15px; transition:all .2s;
}
.check-circle.done{background:var(--success); border-color:var(--success); color:#fff;}
.plan-item.done{opacity:.55;}
.plan-item.done .plan-title{text-decoration:line-through;}
.plan-title{font-size:14.5px; font-weight:700;}
.plan-meta{display:flex; gap:10px; margin-top:4px; font-size:11.5px; color:var(--text-3);}
.plan-meta span{display:flex; align-items:center; gap:3px;}
.cat-dot{width:7px;height:7px;border-radius:50%; flex-shrink:0;}
.cat-درسی{background:var(--primary-bright);}
.cat-توسعه_فردی{background:var(--gold);}
.cat-غیردرسی{background:var(--text-3);}

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:40px 20px; color:var(--text-2);
}
.empty .material-symbols-rounded{font-size:38px; color:var(--text-3); margin-bottom:10px;}
.empty p{margin:4px 0 0; font-size:13.5px;}

/* ---------- Modal / sheet ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,8,18,.72); backdrop-filter:blur(4px);
  z-index:100; display:none; align-items:flex-end; justify-content:center;
}
.overlay.active{display:flex;}
.sheet{
  width:100%; max-width:480px; background:var(--surface);
  border-radius:24px 24px 0 0; border:1px solid var(--border-soft); border-bottom:none;
  padding:10px 20px calc(24px + var(--safe-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideUp .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:6px auto 14px;}
.sheet h2{font-size:17px; font-weight:800; margin:0 0 16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:7px;}
.field input, .field select, .field textarea{
  width:100%; padding:13px 14px; border-radius:var(--radius-sm);
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-1);
  font-size:14.5px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical; min-height:70px;}
.seg{display:flex; background:var(--surface-2); border-radius:var(--radius-sm); padding:4px; gap:4px;}
.seg button{
  flex:1; padding:9px 6px; border:none; background:none; border-radius:8px;
  font-size:12.5px; font-weight:700; color:var(--text-2);
}
.seg button.active{background:var(--primary); color:#fff;}

/* modal for center dialogs (confirm etc) */
.overlay.center{align-items:center;}
.dialog{
  width:88%; max-width:340px; background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:22px; text-align:center; animation:popIn .2s ease;
}
@keyframes popIn{from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);}}
.dialog .material-symbols-rounded.big{font-size:36px; color:var(--primary-bright); margin-bottom:8px;}
.dialog h3{font-size:16px; margin:0 0 6px;}
.dialog p{font-size:13px; color:var(--text-2); margin:0 0 18px;}

/* ---------- toast ---------- */
#toast{
  position:fixed; bottom:calc(96px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface-3); border:1px solid var(--border); color:var(--text-1);
  padding:11px 18px; border-radius:99px; font-size:13px; font-weight:600;
  z-index:200; opacity:0; pointer-events:none; transition:all .25s ease;
  display:flex; align-items:center; gap:8px; white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast .material-symbols-rounded{font-size:17px; color:var(--success);}

/* ---------- Timer screen ---------- */
.timer-orbit{position:relative; width:100%; padding:30px 0 10px; display:flex; justify-content:center;}
.timer-ring-wrap{position:relative; width:270px; height:270px;}
.timer-ring-wrap svg{transform:rotate(-90deg); width:100%; height:100%;}
.timer-ring-bg{fill:none; stroke:var(--surface-3); stroke-width:10;}
.timer-ring-fg{fill:none; stroke:url(#timerGrad); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
.timer-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
}
.timer-display{font-size:46px; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums; text-shadow:0 0 30px var(--primary-glow);}
.timer-label{font-size:12.5px; color:var(--text-2); font-weight:600;}
.timer-controls{display:flex; gap:14px; justify-content:center; margin-top:22px;}
.timer-btn-round{
  width:60px;height:60px;border-radius:50%; border:1px solid var(--border);
  background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-1); font-size:24px;
}
.timer-btn-round.main{
  width:74px;height:74px; background:linear-gradient(135deg,var(--primary-bright),var(--primary));
  box-shadow:0 10px 30px -6px var(--primary-glow); color:#fff; font-size:30px;
}
.mode-pills{display:flex; gap:8px; justify-content:center; margin-top:18px;}

/* ---------- Question card ---------- */
.qcard{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius); padding:15px;}
.qcard + .qcard{margin-top:11px;}
.qcard .qtext{font-size:14px; font-weight:600; line-height:1.9; margin-bottom:10px;}
.qcard .qopts{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
.qopt{font-size:12.5px; color:var(--text-2); padding:8px 11px; background:var(--surface); border-radius:8px; border:1px solid var(--border-soft);}
.qopt.correct{border-color:rgba(34,197,94,.4); color:var(--success); background:rgba(34,197,94,.08);}

/* ---------- Filter bar (scrollable chips) ---------- */
.filter-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-scroll .chip{flex-shrink:0;}

/* ---------- Bar chart (weekly) ---------- */
.barchart{display:flex; align-items:flex-end; justify-content:space-between; height:140px; gap:6px; padding:0 4px;}
.barcol{display:flex; flex-direction:column; align-items:center; gap:8px; flex:1;}
.barcol .bar{width:100%; max-width:26px; border-radius:6px 6px 3px 3px; background:var(--surface-3); position:relative; min-height:4px;}
.barcol .bar > div{position:absolute; bottom:0; right:0; left:0; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg,var(--primary-bright),var(--primary-dim));}
.barcol .bar-label{font-size:10.5px; color:var(--text-3); font-weight:600;}
.barcol.today .bar-label{color:var(--primary-bright);}

/* ---------- Toggle switch ---------- */
.switch{position:relative; width:44px; height:25px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:var(--surface-3); border-radius:99px; transition:.2s; border:1px solid var(--border);}
.switch .slider:before{content:''; position:absolute; width:19px; height:19px; right:2px; top:2px; background:var(--text-2); border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--primary);}
.switch input:checked + .slider:before{background:#fff; transform:translateX(-19px);}

/* ---------- list row (settings/profile) ---------- */
.list-row{display:flex; align-items:center; gap:13px; padding:14px 4px;}
.list-row + .list-row{border-top:1px solid var(--border-soft);}
.list-row .li-icon{width:36px;height:36px;border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:19px; flex-shrink:0;}
.list-row .li-body{flex:1;}
.list-row .li-title{font-size:14px; font-weight:700;}
.list-row .li-sub{font-size:11.5px; color:var(--text-3); margin-top:1px;}

/* Streak days */
.streak-row{display:flex; justify-content:space-between; margin-top:14px;}
.streak-day{display:flex; flex-direction:column; align-items:center; gap:6px;}
.streak-day .d-lbl{font-size:10.5px; color:var(--text-3); font-weight:600;}
.streak-dot{width:30px;height:30px;border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:var(--surface-3); color:var(--text-3);}
.streak-dot.done{background:var(--success); color:#fff;}
.streak-dot.today{background:var(--primary); color:#fff; box-shadow:0 0 0 3px rgba(99,102,241,.25);}

.hide{display:none !important;}
</style>
</head>
<body>

<div id="app">
  <!-- ============ TOP BAR ============ -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">🎯</div>
      <div class="brand-name">اپکس پلنر</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div id="syncStatus" class="icon-btn" style="position:relative; cursor:default;" title="وضعیت اتصال">
        <span class="material-symbols-rounded" id="syncStatusIcon" style="font-size:19px; color:var(--text-3);">cloud_done</span>
        <span id="syncBadge" style="display:none; position:absolute; top:-2px; left:-2px; min-width:16px; height:16px; padding:0 3px; border-radius:8px; background:var(--danger,#ef4444); color:#fff; font-size:9.5px; font-weight:800; align-items:center; justify-content:center;"></span>
      </div>
      <button class="icon-btn" id="btnAlarms"><span class="material-symbols-rounded" style="font-size:19px;">notifications</span><span class="badge-dot hide" id="alarmDot"></span></button>
      <button class="icon-btn" onclick="go('profile')"><span class="material-symbols-rounded" style="font-size:19px;">person</span></button>
    </div>
  </div>

  <!-- ============ SCREENS ============ -->
  <div id="screens"></div>
</div>

<div class="bottomnav">
  <button class="nav-item active" data-nav="home" onclick="go('home')">
    <span class="material-symbols-rounded">home</span><span class="lbl">خانه</span>
  </button>
  <button class="nav-item" data-nav="plan" onclick="go('plan')">
    <span class="material-symbols-rounded">event_note</span><span class="lbl">برنامه</span>
  </button>
  <button class="nav-item" data-nav="timer" onclick="go('timer')">
    <span class="material-symbols-rounded">timer</span><span class="lbl">مطالعه</span>
  </button>
  <button class="nav-item" data-nav="questions" onclick="go('questions')">
    <span class="material-symbols-rounded">quiz</span><span class="lbl">سوالات</span>
  </button>
  <button class="nav-item" data-nav="stats" onclick="go('stats')">
    <span class="material-symbols-rounded">bar_chart</span><span class="lbl">تحلیل</span>
  </button>
</div>

<div id="toast"><span class="material-symbols-rounded">check_circle</span><span id="toastMsg"></span></div>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="sheet.js"></script>
<script src="screens_home.js"></script>
<script src="screens_plan.js"></script>
<script src="screens_timer.js"></script>
<script src="screens_questions.js"></script>
<script src="screens_stats.js"></script>
<script src="screens_profile.js"></script>
<script src="screens_admin.js"></script>
<script>
  document.getElementById('btnAlarms').addEventListener('click', () => openAlarmsSheet());
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
